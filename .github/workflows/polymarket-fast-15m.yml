name: Polymarket Active Paper Test 15m

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polymarket-fast-15m.yml'

permissions:
  contents: read

jobs:
  active-paper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate PAPER_ONLY source
        run: |
          python -m py_compile experiments/polymarket-paper/paper_bot_fast.py
          ! grep -q 'SIGNER_PRIVATE_KEY' experiments/polymarket-paper/paper_bot_fast.py
          ! grep -q 'POST /order' experiments/polymarket-paper/paper_bot_fast.py
      - name: Run active 15-minute live-data simulation
        run: |
          python experiments/polymarket-paper/paper_bot_fast.py \
            --duration 900 --interval 2 --output polymarket-active-results-15m
      - name: Package reports
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          out=pathlib.Path('polymarket-active-results-15m'); out.mkdir(exist_ok=True)
          required=['paper_result.json','trades.csv','market_log.csv','reasoning_log.jsonl','shadow_strategy_results.json','checkpoint.json']
          (out/'validation.json').write_text(json.dumps({n:(out/n).exists() for n in required},indent=2))
          with zipfile.ZipFile('polymarket-active-results-15m.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in out.iterdir():
                  if p.is_file(): z.write(p,p.name)
          PY
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-active-results-15m
          path: polymarket-active-results-15m.zip
          retention-days: 7
          if-no-files-found: error
